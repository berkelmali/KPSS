name: Sync Live KPSS Postings

on:
  schedule:
    # Runs at 04:00, 10:00, 16:00, 22:00 UTC (07:00, 13:00, 19:00, 01:00 Turkey time)
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Fetch and Sync Live Portals Data
        run: npm run sync:live

      - name: Commit and Push Updated Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live_jobs_cache.json src/data/livePostingsData.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync live government job postings [skip ci]" && git push)
